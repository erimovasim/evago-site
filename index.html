<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVAGO — эвакуатор және жол көмегі</title>
<meta name="description" content="EVAGO — эвакуатор шақыру және жолдағы көмек, Алматы, 24/7. Орныңызды картадан белгілеп, бағаны алдын ала көріңіз.">
<meta property="og:site_name" content="EVAGO">
<meta property="og:title" content="EVAGO — эвакуатор және жол көмегі">
<meta property="og:description" content="Алматы · 24/7 · Жолда жалғыз емессің">
<meta property="og:image" content="https://erimovasim.github.io/evago-site/assets/hero.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFD200">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css?v=15">
<style>
/* Hero */
.hero{position:relative;padding-block:44px 64px;overflow:hidden}
.hero-photo{position:absolute;top:0;right:0;width:58%;height:430px;background:url(assets/hero.jpg) center/cover no-repeat}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.6) 18%,rgba(255,255,255,0) 40%),linear-gradient(0deg,#fff 0%,rgba(255,255,255,0) 30%)}
.hero-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.hero-grid>*{min-width:0}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(31,168,85,.15)}
.hero h1{font-size:clamp(42px,6vw,72px);font-weight:800;margin-top:22px;line-height:1.02}
.hero h1 span{display:block}
.hero h1 .y{color:var(--accent);-webkit-text-stroke:.6px #D9AF00}
.hero .lead{font-size:clamp(17px,1.5vw,19px);color:var(--muted);margin-top:18px;max-width:30em}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.stats{display:flex;flex-wrap:wrap;gap:34px;margin-top:40px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.form-col{padding-top:255px}
.m-stats{display:none}
@media (max-width:560px){
  .qo{padding-top:14px}
  .qo .tabs{grid-template-columns:1fr 1fr;gap:6px;border-bottom:0;padding-bottom:6px}
  .qo .tab{border:1.5px solid var(--line);border-radius:12px;margin:0;padding:10px 6px;font-size:13px}
  .qo .tab[aria-selected="true"]{border-color:var(--ink);background:var(--accent-soft)}
}
@media (max-width:960px){.hero-text .stats{display:none}.m-stats{display:flex}}
.active{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:22px}
.active b{display:flex;gap:10px;align-items:center}
.active b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.3}}

/* Quick order card */
.qo{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 20px 20px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:14px 4px 12px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;line-height:1.25;text-align:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.qo .row{display:flex;gap:14px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.qo .row label{flex:1;min-width:0}
.qo .row small{display:block;font-size:13px;color:var(--muted)}
.qo .row input,.qo .row select{display:block;width:100%;border:0;outline:0;background:none;font-size:16px;padding:2px 0}
.qo .row select{font-weight:600;cursor:pointer}
.qo .d{width:10px;height:10px;border-radius:50%;flex:none}
.qo .d-a{background:var(--ink)}.qo .d-b{background:var(--accent);border:2px solid var(--accent-2)}
.qo .row svg{width:20px;height:20px;flex:none;color:#555}
.qo .btn{margin-top:16px}
.qo .geo-n{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}

@media (max-width:960px){
  .hero{padding-block:0 40px}
  .hero-photo{position:absolute;top:0;left:0;right:0;width:auto;height:330px;background-position:30% center}
  .hero-photo::after{background:linear-gradient(180deg,rgba(17,17,17,.05) 0%,rgba(17,17,17,.2) 40%,rgba(17,17,17,.78) 100%)}
  .hero-grid{grid-template-columns:1fr;gap:0}
  .hero-text{min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:22px;color:#fff}
  .hero-text .badge{align-self:flex-start;background:rgba(255,255,255,.92);color:var(--ink);border:0}
  .hero h1{margin-top:14px;font-size:40px;color:#fff}
  .hero .lead,.hero-cta{display:none}
  .stats{order:3;margin-top:22px;gap:22px;justify-content:space-between}
  .stats .stat b{font-size:22px}
  .form-col{padding-top:0;margin-top:0;position:relative}
  .active{margin-bottom:12px}
}

/* Services: фото-карточки (фото кладутся в assets/services/<id>.jpg и assets/cars/<id>.png) */
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pcard{position:relative;display:flex;flex-direction:column;min-height:300px;border-radius:20px;overflow:hidden;padding:22px;background:linear-gradient(160deg,#E9EEF0 0%,#F4F1EC 55%,#FBEFD9 100%);transition:transform .2s,box-shadow .2s;isolation:isolate}
.pcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px -20px rgba(17,17,17,.35)}
.pcard h3{font-size:19px;font-weight:700;max-width:12em}
.pcard p{font-size:14px;color:var(--muted);margin-top:6px;max-width:16em}
.pcard .pr{font-size:24px;font-weight:800;margin-top:10px}
.pcard .pr small{font-size:.6em;font-weight:600;color:var(--muted)}
.pcard .art{position:absolute;right:0;bottom:0;width:78%;height:56%;display:grid;place-items:end;z-index:-1}
.pcard .art img{width:100%;height:100%;object-fit:contain;object-position:right bottom}
.pcard .art.photo img{object-fit:cover;object-position:center}
.pcard .art.photo{width:100%;height:52%;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 35%);mask-image:linear-gradient(180deg,transparent 0,#000 35%)}
.pcard .art svg{width:120px;height:120px;margin:0 18px 18px 0;color:#1F1F1F;opacity:.85}
.pcard .go{position:absolute;left:22px;bottom:22px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.pcard .go svg{width:18px;height:18px}
.cars{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:16px}
.cars .pcard{grid-column:span 2;min-height:280px}
.cars .pcard.wide{grid-column:span 3}
@media (max-width:1000px){.pcards{grid-template-columns:1fr 1fr}.cars{grid-template-columns:1fr 1fr}.cars .pcard,.cars .pcard.wide{grid-column:auto}.cars .pcard.wide:last-child{grid-column:1/-1}}
@media (max-width:560px){.pcards{gap:12px}.pcard{min-height:230px;padding:16px;border-radius:18px}.pcard h3{font-size:16px}.pcard p{display:none}.pcard .pr{font-size:19px}.pcard .go{left:16px;bottom:16px;width:34px;height:34px}.pcard .art svg{width:84px;height:84px;margin:0 12px 12px 0}.cars{gap:12px}.cars .pcard{min-height:240px}.pcard .art{height:44%}}

/* Phone illustration */
.phone{width:290px;max-width:100%;border:10px solid var(--ink);border-radius:44px;background:#fff;overflow:hidden;box-shadow:0 30px 60px -20px rgba(17,17,17,.35)}
.ph-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;padding:10px 20px 6px}
.ph-map{height:240px;position:relative;background:#EEF0EC}
.ph-map svg{position:absolute;inset:0;width:100%;height:100%}
.ph-card{border-radius:18px 18px 0 0;margin-top:-18px;position:relative;background:#fff;padding:16px;box-shadow:0 -8px 20px -10px rgba(0,0,0,.15)}
.ph-row{display:flex;gap:10px;align-items:center;font-size:13px}
.ph-row .d{width:9px;height:9px;border-radius:50%}
.ph-st{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ph-st b{font-size:15px}
.ph-st span{background:var(--accent);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:#fff;border-radius:var(--r);padding:24px}
.step-n{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;margin-bottom:18px}
.step h3{font-size:18px;font-weight:700;margin-bottom:6px}
.step p{color:var(--muted);font-size:15px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* Tariffs */
.tar{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.tar>*{min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;font-weight:600;color:var(--muted);background:var(--gray)}
tr:last-child td{border-bottom:0}
td.price{font-weight:800}
.tnote{font-size:14px;color:var(--muted);margin-top:14px}
@media (max-width:900px){.tar{grid-template-columns:1fr}}

/* Contacts */
.cb{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px}
.cb h2{font-size:clamp(24px,3vw,34px);font-weight:800;margin-top:8px}
.cb p{color:var(--muted);margin-top:8px}
.cb-acts{display:flex;gap:12px;flex-wrap:wrap}
.btn-wa-big{background:#25D366;color:#06210F;font-weight:700}
@media (max-width:560px){.cb{padding:22px}.cb-acts{width:100%}.cb-acts .btn{flex:1}}
/* Drivers + app */
.drv{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;background:var(--accent);border-radius:28px;padding:48px}
.drv>*{min-width:0}
.drv h2{font-size:clamp(28px,3.6vw,42px);font-weight:800}
.drv ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;font-weight:600;font-size:17px}
.drv li{display:flex;gap:10px;align-items:center}
.drv li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--ink);flex:none}
.drv .btn{margin-top:24px}
@media (max-width:820px){.drv{grid-template-columns:1fr;padding:32px 24px}}
.app{background:var(--ink);color:#fff;border-radius:28px;padding:56px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.app>*{min-width:0}
.app h2{font-size:clamp(28px,3.6vw,42px);font-weight:800}
.app .lead{color:#B8B8B0;margin-top:14px;font-size:17px;max-width:32em}
.perks{display:grid;gap:18px}
.perk{display:flex;gap:14px;align-items:flex-start}
.perk-ic{width:46px;height:46px;border:1.5px solid var(--accent);border-radius:12px;display:grid;place-items:center;color:var(--accent);flex:none}
.perk-ic svg{width:22px;height:22px}
.perk b{display:block;font-size:17px}
.perk span{color:#B8B8B0;font-size:15px}
.stores{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.store{display:flex;align-items:center;gap:10px;border:1px solid #444;border-radius:12px;padding:10px 16px;opacity:.75}
.store svg{width:22px;height:22px}
.store small{display:block;font-size:11px;color:var(--accent);line-height:1.2;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.store b{display:block;font-size:15px;line-height:1.2}
.app .btn{margin-top:28px}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:32px 22px}}
</style>
</head>
<body data-page="home">
<header id="site-header"></header>

<main>
  <div class="hero">
    <div class="hero-photo" role="img" aria-label="EVAGO эвакуаторы"></div>
    <div class="wrap hero-grid">
      <div class="hero-text">
        <a class="active" id="active" href="#" hidden><b data-i="active_order"></b><span data-i="open"></span></a>
        <span class="badge"><i></i><span data-i="badge"></span></span>
        <h1><span data-i="h1a">Жолда жалғыз</span><span class="y" data-i="h1b">емессің.</span></h1>
        <p class="lead" data-i="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-y" href="order.html"><span data-i="call"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn btn-o" href="#services"><span data-i="about_services"></span></a>
        </div>
        <div class="stats">
          <div class="stat"><b>24/7</b><span data-i="st1"></span></div>
          <div class="stat"><b class="num" id="n-svc">6</b><span data-i="st2"></span></div>
          <div class="stat"><b class="num" id="n-car">5</b><span data-i="st3"></span></div>
        </div>
      </div>

      <div class="form-col">
        <form class="qo" id="qo" action="order.html">
          <div class="tabs" role="tablist" id="tabs"></div>
          <div class="row"><span class="d d-a"></span><label><small data-i="from"></small><input name="from" id="q-from" data-ph="addr_ph" autocomplete="street-address"></label></div>
          <div class="row" id="q-to-row"><span class="d d-b"></span><label><small data-i="to"></small><input name="to" id="q-to" data-ph="addr_ph"></label></div>
          <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M4 13l2-5h12l2 5v4H4z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg><label><small data-i="car"></small><select name="car" id="q-car"></select></label></div>
          <input type="hidden" name="s" id="q-s" value="tow">
          <button class="btn btn-y btn-block" type="submit"><span data-i="call"></span></button>
          <p class="geo-n" data-i="qo_note"></p>
        </form>
        <div class="stats m-stats">
          <div class="stat"><b>24/7</b><span data-i="st1"></span></div>
          <div class="stat"><b class="num n-svc">4</b><span data-i="st2"></span></div>
          <div class="stat"><b class="num n-car">5</b><span data-i="st3"></span></div>
        </div>
      </div>
    </div>
  </div>

  <section id="services">
    <div class="wrap">
      <div class="sec-h center"><span class="eyebrow" data-i="svc_eyebrow"></span><h2 data-i="svc_h"></h2><p data-i="svc_p"></p></div>
      <div class="pcards" id="svcs"></div>
    </div>
  </section>

  <section class="bg-gray" id="how">
    <div class="wrap">
      <div class="sec-h"><span class="eyebrow" data-i="how_e"></span><h2 data-i="how_h"></h2></div>
      <div class="steps">
        <div class="step"><div class="step-n">1</div><h3 data-i="s1h"></h3><p data-i="s1p"></p></div>
        <div class="step"><div class="step-n">2</div><h3 data-i="s2h"></h3><p data-i="s2p"></p></div>
        <div class="step"><div class="step-n">3</div><h3 data-i="s3h"></h3><p data-i="s3p"></p></div>
        <div class="step"><div class="step-n">4</div><h3 data-i="s4h"></h3><p data-i="s4p"></p></div>
      </div>
    </div>
  </section>

  <section id="tariffs" style="padding-top:0">
    <div class="wrap">
      <div class="sec-h center"><span class="eyebrow" data-i="nav_tariffs"></span><h2 data-i="tar_h2"></h2><p data-i="tar_p"></p></div>
      <div class="cars" id="cars"></div>
      <p class="tnote center" data-i="tnote" style="text-align:center"></p>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="drv">
        <div><span class="eyebrow" style="color:var(--ink)" data-i="drv_eyebrow"></span><h2 style="margin-top:10px" data-i="drv_h"></h2><a class="btn btn-dark" href="driver.html"><span data-i="drv_btn"></span></a></div>
        <ul><li data-i="d1"></li><li data-i="d2"></li><li data-i="d3"></li></ul>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="app">
        <div>
          <div class="logo" style="font-size:40px;margin-bottom:18px">EVA<span>GO</span></div>
          <h2 data-i="app_h"></h2>
          <p class="lead" data-i="app_p"></p>
          <div class="stores">
            <span class="store"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.9-3-.8-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.2.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.5 1.3-2.6 0 0-2.5-1-2.5-3.6zM14.2 5.6c.6-.8 1.1-1.8 1-2.9-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg><span><small data-i="soon"></small><b>App Store</b></span></span>
            <span class="store"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2.8 13.6 12 4 21.2c-.4-.2-.6-.6-.6-1.1V3.9c0-.5.2-.9.6-1.1zm10.6 10.2 2.6 2.6-11 6.2 8.4-8.8zm3.7-3.7 3 1.7c.8.5.8 1.6 0 2l-3 1.7-2.9-2.7 2.9-2.7zM6.2 2.2l11 6.2-2.6 2.6-8.4-8.8z"/></svg><span><small data-i="soon"></small><b>Google Play</b></span></span>
          </div>
          <a class="btn btn-y" href="order.html"><span data-i="call"></span></a>
        </div>
        <div class="perks">
          <div class="perk"><span class="perk-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span><div><b data-i="p1"></b><span data-i="p1d"></span></div></div>
          <div class="perk"><span class="perk-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg></span><div><b data-i="p2"></b><span data-i="p2d"></span></div></div>
          <div class="perk"><span class="perk-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 10h18"/></svg></span><div><b data-i="p3"></b><span data-i="p3d"></span></div></div>
        </div>
      </div>
    </div>
  </section>
</main>

<section class="contact-band" id="contacts" style="padding-top:0">
    <div class="wrap">
      <div class="cb">
        <div><span class="eyebrow" data-i="contact_h"></span><h2 data-i="cb_h"></h2><p data-i="cb_p"></p></div>
        <div class="cb-acts">
          <a class="btn btn-wa-big" id="cb-wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>WhatsApp</a>
          <a class="btn btn-dark" id="cb-call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span class="num" id="cb-num"></span></a>
        </div>
      </div>
    </div>
  </section>

<footer id="contact"></footer>

<div class="fabs">
  <a class="fab fab-sos" href="order.html?s=tow&amp;sos=1" aria-label="SOS">SOS</a>
  <a class="fab fab-wa" id="fab-wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg></a>
</div>

<script src="assets/app.js?v=15"></script>
<script>
let tab = "tow";
function renderHome() {
  $$("#n-svc,.n-svc").forEach(x => x.textContent = EVAGO.services.length);
  $$("#n-car,.n-car").forEach(x => x.textContent = EVAGO.cars.length);
  $("#tabs").innerHTML = EVAGO.services.map(s => s.id).map(id => `<button type="button" role="tab" class="tab" data-t="${id}" aria-selected="${id === tab}">${svcById(id)[LANG][0]}</button>`).join("");
  $$("#tabs .tab").forEach(b => b.onclick = () => { tab = b.dataset.t; renderHome(); });
  $("#q-s").value = tab;
  $("#q-to-row").hidden = tab !== "tow";
  const car = $("#q-car").value;
  $("#q-car").innerHTML = EVAGO.cars.map(c => `<option value="${c.id}">${c[LANG]}</option>`).join("");
  if (car) $("#q-car").value = car;

  const arrow = '<span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
  const fromTxt = n => LANG === "ru" ? `<small>от</small> ${money(n)}` : `${money(n)} <small>${t("from_price")}</small>`;
  // картинка: если файла нет — рисуем иконку
  const art = (src, id, photo) => `<span class="art${photo ? " photo" : ""}"><img src="${src}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('photo');this.outerHTML=icon('${id}',1.4)"></span>`;
  $("#svcs").innerHTML = EVAGO.services.map(s => `<a class="pcard" href="order.html?s=${s.id}"><h3>${s[LANG][0]}</h3><p>${s[LANG][1]}</p><span class="pr num">${fromTxt(minPrice(s))}</span>${art(s.id === "tow" ? "assets/hero.jpg" : "assets/services/" + s.id + ".jpg", s.id, true)}${arrow}</a>`).join("");
  $("#cars").innerHTML = EVAGO.cars.map((c, i) => `<a class="pcard${i >= 3 ? " wide" : ""}" href="order.html?s=tow&car=${c.id}"><h3>${t("tow_of")} ${c[LANG].toLowerCase()}</h3><span class="pr num">${fromTxt(c.base)}</span><span class="pr num" style="font-size:14px;font-weight:600;color:var(--muted);margin-top:2px">+ ${money(c.km)} / ${t("o_km")}</span>${art("assets/cars/" + c.id + ".png", "car", false)}${arrow}</a>`).join("");

  $("#cb-wa").href = "https://wa.me/" + EVAGO.whatsapp + "?text=" + encodeURIComponent(t("wa_hello"));
  $("#cb-call").href = "tel:" + EVAGO.phone.replace(/\s/g, ""); $("#cb-num").textContent = EVAGO.phone;
  const id = lastOrder();
  $("#active").hidden = !id;
  if (id) $("#active").href = "track.html?id=" + encodeURIComponent(id);
}
$("#qo").addEventListener("submit", e => {
  e.preventDefault();
  const p = new URLSearchParams({ s: tab, car: $("#q-car").value });
  const f = $("#q-from").value.trim(), to = $("#q-to").value.trim();
  if (f) p.set("from", f);
  if (to && tab === "tow") p.set("to", to);
  location.href = "order.html?" + p.toString();
});
document.addEventListener("DOMContentLoaded", renderHome);
onLang(renderHome);
</script>
</body>
